ServerName swirhen.tv
ServerTokens Prod
AddHandler php-script .php
AddType text/html .php
AddType audio/x-m4a .m4a
AddType audio/x-m4b .m4b

<VirtualHost *:80>
    ServerName swirhen.tv
    ServerAdmin swirhen@gmail.com

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName swirhen.tv
    ServerAdmin swirhen@gmail.com
    DocumentRoot /var/www

    SSLEngine on

    SSLCertificateFile /etc/letsencrypt/live/swirhen.tv/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/swirhen.tv/privkey.pem

  <Directory />
    Options FollowSymLinks
    AllowOverride None
    Order allow,deny
    deny from all
  </Directory>
  <Directory /var/www/>
    Options Indexes FollowSymLinks MultiViews ExecCGI
    AllowOverride All
    Order allow,deny
    allow from all
    <Files index.html>
      AuthUserFile /home/swirhen/.passwd
      AuthName  "umuumusodasoda"
      AuthType  Basic
      require user dankogai
    </Files>
    <Files index.htm>
      AuthUserFile /home/swirhen/.passwd
      AuthName "umuumusodasoda"
      AuthType Basic
      require user dankogai
    </Files>
  </Directory>

  ProxyPass        /torrent-admin/api/ http://127.0.0.1:8000/api/
  ProxyPassReverse /torrent-admin/api/ http://127.0.0.1:8000/api/

  Alias /torrent-admin/ /home/swirhen/sh/checker/torrentsearch/web/dist/
  <Directory /home/swirhen/sh/checker/torrentsearch/web/dist/>
    Options FollowSymLinks
    AllowOverride None
    Order allow,deny
    Allow from all
    Require all granted
  </Directory>

  ProxyPass        /radio-record/api/ http://127.0.0.1:8001/api/
  ProxyPassReverse /radio-record/api/ http://127.0.0.1:8001/api/

  # radio_record のリポジトリ(config.json や radio.db)を公開しない。録音ファイルの vault/ とトップの index.html のみ許可
  <LocationMatch "^/share/radio_record/(?!vault/|index\.html$|$)">
    Require all denied
  </LocationMatch>

  # 玄関ダッシュボード(/var/www/entrance-dashboard)は Basic 認証なしで公開する
  # 画面の表示に使うファイルのみ許可し、.git や README などリポジトリの中身は公開しない
  # （config.js はブラウザが読み込むため拒否できない。API キーは Google Cloud 側のウェブサイトの制限で守る）
  <Location "/entrance-dashboard/">
    Require all granted
  </Location>
  <LocationMatch "^/entrance-dashboard/(?!(index\.html|app\.js|style\.css|config\.js)?$)">
    Require all denied
  </LocationMatch>
  # 伝言メモはローカルで開いたダッシュボードからも読めるように CORS を許可する
  <Location "/share/dengon.txt">
    Header always set Access-Control-Allow-Origin "*"
  </Location>

  Alias /radio-record/ /data/share/radio_record/web/dist/
  <Directory /data/share/radio_record/web/dist/>
    Options FollowSymLinks
    AllowOverride None
    Order allow,deny
    Allow from all
    Require all granted
  </Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>
