[tasks.rh]
description = "音楽フォルダリネーム(hololive.* を削除)"
dir = "{{cwd}}"
run = "rename 's/\\[.*?\\]\\ hololive.*?\\ (.*?.*)\\ \\[.*\\]/$1/' *\\[*"

[tasks.rh2]
description = "音楽フォルダリネーム(hololive.* を削除しない)"
dir = "{{cwd}}"
run = "rename 's/\\[.*?\\]\\ (.*?.*)\\ \\[.*\\]/$1/' *\\[*"

[tasks.zt]
description = "ディレクトリ内zipのタイムスタンプ更新(zip内の最新ファイルで)"
dir = "{{cwd}}"
run = """
#!/usr/bin/env zsh
HOURS="${1:-24}"
for z in *.zip(mh-${HOURS}.N); do
  /data/share/temp/touch_zip_latest.sh "${z}"
done
"""

[tasks.dz]
description = "ディレクトリを全部zipにする"
dir = "{{cwd}}"
run = """
#!/usr/bin/env zsh
for d in */(N); do
  d=`echo "${d}" | sed -e "s:/::"`
  zip -9 -r "$d.zip" "$d"; rm -rf "$d"
done
"""

[tasks.avr]
description = "AVディレクトリリネーム・テスト後に確認して実行(一般AV)"
dir = "{{cwd}}"
run = """
#!/usr/bin/env zsh
set -e
set -o pipefail
typeset -a sources expressions
for av in [A-Z]*[0-9]/(N); do
  av="${av%/}"
  title=`python /home/swirhen/sh/title_get.py a "${av}" | sed -e "s:/::g"`
  if [ "${title}" = "NORESULTSFOUND" ]; then continue; fi
  sources+=("${av}")
  expressions+=("s/${av}/${title}/")
  print -r -- "rename 's/${av}/${title}/' '${av}'"
done
if (( $#sources == 0 )); then
  print -r -- "リネーム対象がありません。"
  exit 0
fi
if ! read -r "answer?上記の内容でリネームしますか？ [y/N] "; then
  print -r -- "キャンセルしました。"
  exit 0
fi
case "${answer}" in
  y|Y|yes|YES) ;;
  *) print -r -- "キャンセルしました。"; exit 0 ;;
esac
for (( i = 1; i <= $#sources; i++ )); do
  rename "${expressions[i]}" "${sources[i]}"
done
"""

